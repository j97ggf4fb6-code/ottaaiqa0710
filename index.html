document.addEventListener('dblclick',e=>e.preventDefault(),{passive:false});
document.addEventListener('touchmove',e=>{if(e.touches&&e.touches.length>1)e.preventDefault()},{passive:false});
let lastTap=0;document.addEventListener('touchend',e=>{if(e.target&&e.target.closest&&e.target.closest('input'))return;const t=Date.now();if(t-lastTap<350)e.preventDefault();lastTap=t},{passive:false});
/* ---------- online (ルーム対戦) ---------- */
let onl=false;
const D=7,ALPH='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
const net={room:null,role:'',code:'',st:'idle',g:0,ch:-1,nm:null,opp:null,gp:null,myPeer:'',t0:0,hadHost:false,goneT:0,run:false,nf:0,loc:[],rem:[],oppAck:D-1};
const nov=document.getElementById('nov'),nc=document.getElementById('nc'),CMD_OFF=document.querySelector('.cmd').innerHTML,
CMD_ON='【操作】①②③ボタン＝必殺技（ゲージ25）／✨＝超必殺（ゲージ75）<br>▶＋✨＝技① ／ ◀＋✨＝技②<br>特殊技：▶+👊 重パンチ ▶+🦵 打ち上げ 🛡+🦵 足払い';
const cleanName=s=>String(s||'').replace(/[<>&"']/g,'').trim().slice(0,8);
function initAc(){try{ac=ac||new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}
function genCode(){let s='';const a=new Uint32Array(7);try{crypto.getRandomValues(a)}catch(e){for(let i=0;i<7;i++)a[i]=Math.random()*4294967296}for(let i=0;i<7;i++)s+=ALPH[a[i]%32];return s}
function nUI(o){nc.innerHTML='';const h=document.createElement('h1');h.style.fontSize='24px';h.textContent=o.t;nc.appendChild(h);
 if(o.code){const c=document.createElement('div');c.className='code';c.textContent=o.code;nc.appendChild(c)}
 if(o.name){const i=document.createElement('input');i.id='nmi';i.className='jin nm';i.maxLength=8;i.placeholder='なまえ';i.setAttribute('autocomplete','off');i.value=pnm||'';i.onkeydown=e=>{if(e.key==='Enter'){const j=document.getElementById('jc');if(j)j.focus();else if(o.onEnter)o.onEnter()}};nc.appendChild(i)}
 if(o.input){const i=document.createElement('input');i.id='jc';i.className='jin';i.maxLength=7;i.placeholder='XXXXXXX';i.setAttribute('autocapitalize','characters');i.setAttribute('autocomplete','off');i.setAttribute('autocorrect','off');i.spellcheck=false;i.value=o.val||'';i.oninput=()=>{i.value=i.value.toUpperCase().replace(/[^A-Z0-9]/g,'')};i.onkeydown=e=>{if(e.key==='Enter'&&o.onEnter)o.onEnter(i.value)};nc.appendChild(i)}
 if(o.m){const p=document.createElement('p');p.textContent=o.m;nc.appendChild(p)}
 (o.b||[]).forEach(([l,f,c])=>{const b=document.createElement('button');b.className='pb '+(c||'');b.textContent=l;b.onclick=f;nc.appendChild(b)});
 nov.style.display='flex'}
function toTitle(){ph='title';pad2.style.display='none';document.getElementById('pad').style.display='';sel.style.display='none';nov.style.display='none';ov('手書きファイト！','ノートに描いた落書きの戦士たち！<br>キャラを選んで勝ち抜け！','1人で遊ぶ（vs CPU）');fit()}
function netReset(){const rm=net.room;net.room=null;if(rm){try{Promise.resolve(rm.leave()).catch(()=>{})}catch(e){}}net.st='idle';net.run=false;net.opp=null;net.gp=null;net.g=0;net.ch=-1;net.hadHost=false;net.goneT=0;net.nm=null}
function netExit(){netReset();onl=false;m2=false;tr=false;nov.style.display='none';document.querySelector('.cmd').innerHTML=CMD_OFF}
function leaveBtn(){return['やめる',()=>{netExit();toTitle()}]}
function nErr(msg){netExit();nUI({t:'ごめん！',m:msg,b:[['もどる',()=>{nov.style.display='none';toTitle()}]]})}
function mkPeerRoom(role,code){return new Promise((resolve,reject)=>{
 if(typeof Peer==='undefined'){reject({type:'nolib'});return}
 const id='tfight-'+code.toLowerCase();let pr;
 try{pr=role==='h'?new Peer(id):new Peer()}catch(e){reject({type:'nolib'});return}
 const R={mine:{},remote:null,conn:null,id:'',oid:'',failed:null,dead:false};
 const send=()=>{if(R.conn&&R.conn.open){try{R.conn.send({p:R.mine})}catch(e){}}};
 const bind=c=>{R.conn=c;R.oid=c.peer;c.on('open',send);c.on('data',m=>{if(m&&m.p)R.remote=m.p});c.on('close',()=>{if(R.conn===c){R.conn=null;R.remote=null}});c.on('error',()=>{});if(c.open)send()};
 let opened=false;const tm=setTimeout(()=>{if(!opened){try{pr.destroy()}catch(e){}reject({type:'timeout'})}},10000);
 pr.on('open',pid=>{opened=true;clearTimeout(tm);R.id=pid;if(role==='g')bind(pr.connect(id,{reliable:true}));resolve(R)});
 pr.on('connection',c=>{if(R.conn&&R.conn.open){c.on('open',()=>{try{c.send({full:1})}catch(e){}setTimeout(()=>{try{c.close()}catch(e){}},400)});return}bind(c)});
 pr.on('error',e=>{if(R.dead)return;if(!opened){clearTimeout(tm);try{pr.destroy()}catch(x){}reject(e);return}if(e.type==='peer-unavailable')R.failed='notfound';else R.failed='net'});
 pr.on('disconnected',()=>{if(!R.dead){try{pr.reconnect()}catch(e){}}});
 R.presence=p=>{const m=Object.assign({},R.mine,p);for(const k in m)if(m[k]===null)delete m[k];R.mine=m;send();return Promise.resolve()};
 R.peers=()=>{const a=[{peer:R.id,isMe:true,presence:R.mine}];if(R.conn&&R.conn.open&&R.remote)a.push({peer:R.oid,isMe:false,presence:R.remote});return a};
 R.leave=()=>{R.dead=true;try{pr.destroy()}catch(e){}return Promise.resolve()};
})}
const netErrMsg=e=>e&&e.type==='nolib'?'通信ライブラリを読み込めなかったよ。ネットにつながってるか確認してね。':'サーバーにつなげなかったよ。もう一度ためしてね。';
function readName(){const el=document.getElementById('nmi'),v=cleanName(el&&el.value);if(!v){const p=nc.querySelector('p');if(p)p.textContent='なまえを入れてね！（8文字まで）';return ''}pnm=v;try{localStorage.setItem('tf_name',v)}catch(e){}document.getElementById('pname').value=v;return v}
function netBegin(rm,role,code){netReset();onl=true;net.room=rm;net.role=role;net.code=code;net.t0=performance.now();net.st=role==='h'?'wait':'join';
 try{rm.presence({role,nm:pnm,ch:-1,g:0,s:0,d:'',a:0}).catch(()=>{})}catch(e){}}
function hostWaitUI(){nUI({t:'ルームを作ったよ！',code:net.code,m:'このコードを友だちに教えてね。入ってくるまで待ってるよ…',b:[['📋 コードをコピー',function(){try{navigator.clipboard.writeText(net.code).then(()=>{this.textContent='コピーした！'},()=>{});}catch(e){}}],leaveBtn()]})}
function netCreateUI(){nUI({t:'ルームを作る',name:1,m:'あなたのなまえを入れてね',onEnter:doCreate,b:[['作る',doCreate],['もどる',()=>{nov.style.display='none';toTitle()}]]})}
async function doCreate(){
 if(!readName())return;
 nUI({t:'ルームを作る',m:'準備中…'});
 for(let k=0;k<4;k++){const code=genCode();
  try{const rm=await mkPeerRoom('h',code);netBegin(rm,'h',code);hostWaitUI();return}
  catch(e){if(e&&e.type==='unavailable-id')continue;nErr(netErrMsg(e));return}}
 nErr('ルームを作れなかったよ。もう一度ためしてね。')}
function netJoinUI(msg){const keep=(document.getElementById('jc')||{}).value;nUI({t:'ルームに入る',name:1,input:1,val:keep||'',m:msg||'なまえと、7けたのコードを入れてね',onEnter:netJoin,b:[['入る',()=>netJoin()],['もどる',()=>{nov.style.display='none';toTitle()}]]})}
async function netJoin(){
 const code=String((document.getElementById('jc')||{}).value||'').toUpperCase().replace(/[^A-Z0-9]/g,'');
 if(!readName())return;
 if(code.length!==7){const p=nc.querySelector('p');if(p)p.textContent='コードは7けただよ！';return}
 nUI({t:'接続中…',m:'ルーム '+code+' を探しているよ'});
 let rm;try{rm=await mkPeerRoom('g',code)}catch(e){nErr(netErrMsg(e));return}
 netBegin(rm,'g',code);nUI({t:'接続中…',m:'ルーム '+code+' を探しているよ',b:[leaveBtn()]})}
function netFail(msg){netExit();nUI({t:'入れなかった…',m:msg,b:[['もう一度',()=>netJoinUI()],['タイトルへ',()=>{nov.style.display='none';toTitle()}]]})}
function showSelOnline(){nov.style.display='none';document.getElementById('ov').style.display='none';sel.style.display='flex';cards[3].style.display='';document.getElementById('nrow').style.display='';document.getElementById('seltitle').textContent='キャラを選べ！';const on=net.opp?cleanName(net.opp.presence.nm):'';document.getElementById('pname').value=pnm||'';document.querySelector('.cmd').innerHTML=CMD_ON+'<br>ルーム: '+net.code+(on?' ／ あいて: '+on:'')}
function netPick(i){if(!net.room)return;pnm=cleanName(document.getElementById('pname').value);try{localStorage.setItem('tf_name',pnm)}catch(e){}
 net.ch=i;try{net.room.presence({ch:i,nm:pnm,g:net.g}).catch(()=>{})}catch(e){}
 sel.style.display='none';nUI({t:'相手を待ってるよ…',m:(net.opp&&cleanName(net.opp.presence.nm)?'あいて: '+cleanName(net.opp.presence.nm)+'　':'')+'相手がキャラを選んだらスタート！',b:[leaveBtn()]})}
function netLeft(){net.run=false;net.st='left';ph='title';sel.style.display='none';const host=net.role==='h',b=[];
 if(host)b.push(['このルームで待つ',netReWait]);b.push(['タイトルへ',()=>{netExit();toTitle()}]);
 nUI({t:'相手がいなくなった…',m:host?'ルームはそのまま使えるよ。':'',b})}
function netReWait(){if(!net.room)return;net.g=0;net.ch=-1;net.gp=null;net.opp=null;net.goneT=0;net.st='wait';try{net.room.presence({gp:null,ch:-1,g:0,s:0,d:'',a:0}).catch(()=>{})}catch(e){}hostWaitUI()}
function netEnd(){net.run=false;net.st='end';const hw=wins[0]>=2,won=hw===(net.role==='h'),nm=(hw?P.name:E.name).replace(' (あなた)','');
 nUI({t:won?'勝った！🏆':'負けた…',m:nm+' の勝ち！',b:[['もう一回',netRematch],['ルームを出る',()=>{netExit();toTitle()}]]})}
function netRematch(){if(!net.room)return;net.g++;net.ch=-1;net.st='sel';try{net.room.presence({g:net.g,ch:-1,s:0,d:'',a:0}).catch(()=>{})}catch(e){}showSelOnline()}
function netPoll(){
 const rm=net.room;if(!rm||!onl)return;
 if(rm.failed){const f=rm.failed;rm.failed=null;if(f==='notfound'){netFail('ルームが見つからなかったよ。コードをもう一度たしかめてね。');return}if(net.st==='sel'||net.st==='play'||net.st==='end'){netLeft();return}netFail('つなげなかったよ。もう一度ためしてね。');return}
 const ps=rm.peers(),mp=ps.find(p=>p.isMe);if(!mp)return;net.myPeer=mp.peer;
 const oth=ps.filter(p=>!p.isMe),now=performance.now();
 if(net.role==='h'){
  const gs=oth.filter(p=>p.presence.role==='g');
  if(net.gp){const g=gs.find(p=>p.peer===net.gp);
   if(g){net.opp=g;net.goneT=0}
   else{net.opp=null;if(!net.goneT)net.goneT=now;else if(now-net.goneT>4000){net.goneT=0;net.gp=null;rm.presence({gp:null}).catch(()=>{});if(net.st==='sel'||net.st==='play'||net.st==='end')netLeft()}}}
  if(!net.gp&&gs.length&&net.st!=='left'){net.gp=gs[0].peer;net.opp=gs[0];rm.presence({gp:net.gp}).catch(()=>{})}
  if(net.st==='wait'&&net.opp){net.st='sel';net.ch=-1;showSelOnline()}
 }else{
  const h=oth.find(p=>p.presence.role==='h');
  if(!h){
   if(net.hadHost){net.opp=null;if(!net.goneT)net.goneT=now;else if(now-net.goneT>4000&&net.st!=='left'){net.goneT=0;netLeft()}}
   else if(net.st==='join'&&now-net.t0>6000)netFail('ルームが見つからなかったよ。コードをもう一度たしかめてね。');
   return}
  net.hadHost=true;net.goneT=0;const gp=h.presence.gp;
  if(gp===net.myPeer){net.opp=h;if(net.st==='join'){net.st='sel';net.ch=-1;showSelOnline()}}
  else if(net.st==='join'){if(gp)netFail('このルームはもう満員だよ。');else if(now-net.t0>6000)netFail('つなげなかったよ。もう一度ためしてね。')}
 }
 if(net.st==='sel'&&net.opp&&net.ch>=0){const o=net.opp.presence;if(o.ch>=0&&o.g===net.g)startMatch()}}
function startMatch(){
 const o=net.opp.presence,H=net.role==='h',cl=v=>Math.max(0,Math.min(8,v|0)),
 hc=H?net.ch:cl(o.ch),gc=H?cl(o.ch):net.ch,hn=H?pnm:cleanName(o.nm),gn=H?cleanName(o.nm):pnm;
 net.nm=[(hn||CH[hc].n)+(H?' (あなた)':''),(gn||CH[gc].n)+(H?'':' (あなた)')];
 net.st='play';net.run=true;net.nf=0;net.loc=[];net.rem=[];for(let i=0;i<D;i++){net.loc.push(0);net.rem.push(0)}net.oppAck=D-1;
 buf.p=buf.k=buf.s=buf.qt=0;ctl.l=ctl.r=ctl.j=ctl.g=0;
 nov.style.display='none';sel.style.display='none';document.getElementById('ov').style.display='none';
 newGame(hc,gc);
 document.getElementById('pad').style.display='';pad2.style.display='none';fit();
 try{net.room.presence({s:D,d:'',a:D-1}).catch(()=>{})}catch(e){}}
/* 入力は2文字/フレームで符号化。presence(状態)で送るのでパケットロスに強い */
const enc=v=>String.fromCharCode(48+(v>>6&63),48+(v&63));
const decAt=(s,i)=>((s.charCodeAt(i*2)-48)<<6)|(s.charCodeAt(i*2+1)-48);
const QN=['special','shoryu','spin'];
const dec=v=>({l:v&1,r:v>>1&1,j:v>>2&1,g:v>>3&1,p:!!(v&16),k:!!(v&32),s:!!(v&64),as:1,cmd:[undefined,'special','shoryu','spin'][v>>7&3]});
function sampleLocal(){let v=(ctl.l?1:0)|(ctl.r?2:0)|(ctl.j?4:0)|(ctl.g?8:0)|(buf.p>0?16:0)|(buf.k>0?32:0)|(buf.s>0?64:0);if(buf.qt>0)v|=(QN.indexOf(buf.q)+1)<<7;buf.p--;buf.k--;buf.s--;buf.qt--;return v}
function pushNet(){const from=Math.max(D,net.oppAck+1);let d='';for(let i=from;i<net.loc.length;i++)d+=enc(net.loc[i]);try{net.room.presence({s:from,d,a:net.rem.length-1}).catch(()=>{})}catch(e){}}
function netStep(){
 const op=net.opp&&net.opp.presence;
 if(op&&op.g===net.g){const s=op.s|0,d=typeof op.d==='string'?op.d:'';for(let i=0;i*2+1<d.length;i++){const f=s+i;if(f===net.rem.length)net.rem.push(decAt(d,i));else if(f>net.rem.length)break}if(op.a!==undefined)net.oppAck=op.a|0}
 if(net.rem.length<=net.nf||net.loc.length-(net.oppAck+1)>240){pushNet();return null}
 const rv=net.rem[net.nf],lv=net.loc[net.nf];net.loc.push(sampleLocal());net.nf++;pushNet();
 const L=dec(lv),R=dec(rv);return net.role==='h'?[L,R]:[R,L]}
let last=0,acc=0;function loop(ts){requestAnimationFrame(loop);try{netPoll()}catch(e){}const dt=Math.min(50,ts-last);last=ts;acc+=dt;while(acc>=16.667){acc-=16.667;tick()}draw();pzb.style.display=(ph==='intro'||ph==='fight'||ph==='end')&&!paused&&sel.style.display!=='flex'?'block':'none';{const t=tr&&ph==='fight'&&!paused&&sel.style.display!=='flex'?'block':'none';dmb.style.display=dmr.style.display=t}if(sel.style.display==='flex')drawPrev()}
requestAnimationFrame(loop);
</script></body></html>
